{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notification-service.fullname" . }}-allow-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  podSelector:
    matchLabels:
      {{- include "notification-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- .podSelector | toYaml | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}
