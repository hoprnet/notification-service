---
################################################################################
###                     Pipeline on merge to master                         ###
################################################################################
name: Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - master

concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-docker:
    name: Docker
    if: github.event.pull_request.merged == true
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-docker-v4.0.1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.merge_commit_sha }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix run .#docker-x86_64-linux"
          }
        ]
      docker_image_name: notification-service
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-helm:
    name: Helm
    if: github.event.pull_request.merged == true
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Helm chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' charts/notification-service/Chart.yaml | sed 's/version: //')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup GCP
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@483557b623d1b9d0613506c467e8f124841df778
        with:
          login_artifact_registry: 'true'
          install_sdk: 'true'

      - name: Package Helm chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: helm package charts/notification-service --version "$CHART_VERSION"

      - name: Push Helm chart to Artifact Registry
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
        run: |
          helm push "notification-service-${CHART_VERSION}.tgz" \
            "oci://europe-west3-docker.pkg.dev/${GOOGLE_PROJECT}/helm-charts"
