---
################################################################################
###                     Pipeline on merge to master                         ###
################################################################################
name: Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - master

concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-docker:
    name: Docker
    if: github.event.pull_request.merged == true
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@5be6fbca6ea8b13afa4d111724ff83c78456d13e # build-docker-v3.4.3
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix run .#docker-x86_64-linux"
          }
        ]
      docker_image_name: notification-service
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-helm:
    name: Helm
    if: github.event.pull_request.merged == true
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read Helm chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' charts/notification-service/Chart.yaml | sed 's/version: //')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup GCP
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@45221eb1aadfc5c46751306c5c7d6d291c8a24b3
        with:
          login_artifact_registry: 'true'
          install_sdk: 'true'

      - name: Package Helm chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: helm package charts/notification-service --version "$CHART_VERSION"

      - name: Push Helm chart to Artifact Registry
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
        run: |
          helm push "notification-service-${CHART_VERSION}.tgz" \
            "oci://europe-west3-docker.pkg.dev/${GOOGLE_PROJECT}/helm-charts"
