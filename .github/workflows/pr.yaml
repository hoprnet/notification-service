---
################################################################################
###                      Pipeline for pull requests                          ###
################################################################################
name: PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-pr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docker:
    name: Docker
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@45221eb1aadfc5c46751306c5c7d6d291c8a24b3 # build-docker-v3.1.3
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix run .#docker-x86_64-linux"
          }
        ]
      docker_image_name: notification-service
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-helm:
    name: Helm
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Helm chart
        run: helm lint charts/notification-service

      - name: Render Helm chart (dry-run)
        run: helm template notification-service charts/notification-service

  # Single required check for the branch ruleset: green only when every other
  # job in this run succeeded, so adding, renaming, or removing a job never
  # needs a ruleset change. `if: always()` runs it even when a dependency
  # fails; alls-green then reds the gate on any failure or disallowed skip.
  # No job here may skip, so allowed-skips is empty.
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - build-docker
      - build-helm
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
